services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - '5432:5432'
    volumes:
      - orbit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbit -d orbit']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        # The server applies migrations at startup, so it must not start before
        # the database can answer (FR-019).
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orbit:orbit@db:5432/orbit
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  orbit-db-data:
