services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - '5432:5432'
    volumes:
      - orbit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbit -d orbit']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  orbit-db-data:
